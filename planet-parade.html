<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet Parade</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      .planet-parade{
        display:grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
        margin:40px auto;
        width:85%;
    }
    .planet-card {
        display: inline-block;
        margin: 10px;
        text-align: center;
        background-color: #f9f9f9;
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 5px;
        transition: transform 0.3s ease;
    }
    .planet-card:hover {
        transform: scale(1.05);
    }
    .planet-card img{
        width:100%;
        max-height:150px;
        border-style:groove;
        border-width: 2px;
        border-radius: 5px;
        border-color:green;
    }
    .planet-card figcaption{
        margin:10px;
        font-size:0.95em;
        color:grey;
        font-weight:600;
    }
    .planet-card h1{
        margin:10px 0 5px;
        color:cyan;
    }
    </style>
</head>
<body>
  <div class="planet-parade">
    <figure class="planet-card">
  <h1>Planet Parade</h1>
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTihYUI5GI0LENtcPlM2mwdBSF83Ji_Vb9aJwePg4VCXg&s=10" alt="Mercury">
  <figcaption>Mercury is the smallest and closest planet to the Sun in our solar system, characterized by a heavily cratered, Moon-like surface, a rapid 88-day orbit, and extreme temperature swings ranging from scorching heat to freezing cold due to its lack of a substantial atmosphere.</figcaption>
  </figure>
  <figure class="planet-card">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTiMXmYBlz_SxmgNDupc6VlaooBaF0OSJZopvnQBpsfgg&s=10" alt="Venus">
  <figcaption>Venus is the second planet from the Sun, known for its thick, toxic atmosphere of carbon dioxide, extreme surface temperatures, and volcanic landscape, making it the hottest planet in our solar system despite not being the closest to the Sun.</figcaption>
  </figure>
  <figure class="planet-card">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT52IzXsQGlLVQ7SMzxf6DXjNCJAKVC7WnKT4dfTp_gQA&s=10" alt="Earth">
  <figcaption>Earth is the third planet from the Sun and the only known planet to support life, with a diverse climate, abundant water, and a protective atmosphere that sustains ecosystems and human civilization.</figcaption>
  </figure>
  <figure class="planet-card">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS63njCQYcOH-RWC7FWFEa9pFTyhSYDGlIeBwTkmAkmYw&s" alt="Mars">
  <figcaption>Mars, the fourth planet from the Sun, is known as the Red Planet due to its iron oxide-rich surface, featuring the largest volcano and canyon in the solar system, and is a primary target for exploration in the search for past or present life.</figcaption>
  </figure>
  </div> <!-- .planet-parade -->
</body>
</html>
